name: Sync Secret & Deploy Functions

on:
    workflow_dispatch: # 수동 실행 가능
    push:
        branches:
            - main
        paths:
            - "functions/**"

jobs:
    sync-and-deploy:
        name: Sync GEMINI_API_KEY → Firebase & Deploy Functions
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Validate Required Secrets
              run: |
                  if [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then
                    echo "ERROR: GEMINI_API_KEY secret is not set"
                    exit 1
                  fi
                  if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ]; then
                    echo "ERROR: FIREBASE_SERVICE_ACCOUNT secret is not set"
                    exit 1
                  fi

            - name: Set up Node.js 20
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Install firebase-tools
              run: npm install -g firebase-tools

            - name: Install Functions dependencies
              run: cd functions && npm ci

            - name: Authenticate Firebase CLI via Service Account
              run: |
                  cat <<'EOF' > /tmp/sa.json
                  ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
                  EOF
                  echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json" >> $GITHUB_ENV

            - name: Sync GEMINI_API_KEY to Firebase Secret Manager
              env:
                  GEMINI_API_KEY_VALUE: ${{ secrets.GEMINI_API_KEY }}
              run: |
                  printf '%s' "$GEMINI_API_KEY_VALUE" > /tmp/gemini_key.txt
                  firebase functions:secrets:set GEMINI_API_KEY --data-file=/tmp/gemini_key.txt --project moovest --force

            - name: Deploy Functions (asia-northeast3)
              run: |
                  firebase deploy --project moovest --only functions --non-interactive --force

            - name: Cleanup credentials
              if: always()
              run: rm -f /tmp/sa.json /tmp/gemini_key.txt
